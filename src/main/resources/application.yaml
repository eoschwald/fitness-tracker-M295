spring:
  application:
    name: fitness-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_tracker
    username: postgres
    password: DlaWl@8826
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
