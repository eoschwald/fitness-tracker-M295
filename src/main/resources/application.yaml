      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fitness-tracker

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
